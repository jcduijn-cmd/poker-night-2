<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c0f08">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Poker night">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Poker night</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bevan&family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="banner" class="banner" role="status" hidden>Connection lost. Reconnecting…</div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <main id="home" class="screen" hidden>
    <div class="plaque wood">
      <div class="felt-card">
        <h1>Poker night</h1>
        <p class="lede">A Texas Hold'em tournament for you and your friends. Chips only, no real money.</p>
        <form id="home-form" autocomplete="off">
          <label>Your name
            <input id="name" maxlength="20" autocomplete="nickname" required>
          </label>
          <label>PIN (4 digits)
            <input id="pin" class="code-input" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="1234" required>
          </label>
          <p class="hint">Pick any PIN. If you get disconnected, join again with the same name and PIN to get your seat back.</p>
          <label>Table code
            <input id="code" class="code-input" maxlength="4" placeholder="K7QM" autocapitalize="characters" spellcheck="false">
          </label>
          <div id="home-help"></div>
          <div class="btn-col">
            <button type="submit" id="join-btn" class="btn primary" disabled>Join table</button>
            <button type="button" id="create-btn" class="btn" disabled>Create a new table</button>
            <button type="button" id="install-link" class="link" hidden>Put Poker night on your home screen</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <main id="lobby" class="screen" hidden></main>

  <div id="game" class="game" hidden>
    <header class="topbar wood" id="topbar"></header>
    <section class="table-area">
      <div class="table wood" id="table">
        <div class="rail"></div>
        <div class="studs" id="studs"></div>
        <div class="felt"><span class="felt-mark">Poker night</span></div>
        <div class="center" id="center"></div>
        <div id="seats"></div>
        <div class="pops" id="pops"></div>
      </div>
      <button type="button" id="emoji-btn" class="round-btn wood" aria-label="Send an emoji" aria-expanded="false">😀</button>
      <div id="emoji-panel" class="emoji-panel wood" role="menu" hidden></div>
    </section>
    <footer class="actions wood" id="actions"></footer>
  </div>

  <div id="menu" class="menu wood" role="menu" hidden></div>
  <div id="history" class="overlay sheet-wrap" hidden></div>
  <div id="help" class="overlay sheet-wrap" hidden></div>
  <div id="paused" class="overlay" hidden></div>
  <div id="over" class="overlay" hidden></div>

  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
